<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Kevin Jessy Pango — Full-Stack Software Engineer, Founder of KODXO">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fa"/>
      <stop offset="1" stop-color="#e8eefc"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0000000a" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#2f6fed" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2f6fed" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="r"><rect width="1200" height="260" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#r)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>
    <rect width="1200" height="260" fill="url(#glow)"/>
    <rect x="60" y="52" width="44" height="4" rx="2" fill="#2f6fed">
      <animate attributeName="width" values="44;120;44" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="60" y="112" font-size="50" font-weight="700" fill="#1f2328" letter-spacing="-0.5">Kevin Jessy Pango</text>
    <text x="60" y="152" font-size="21" fill="#424a53">Full-Stack Software Engineer <tspan fill="#2f6fed">·</tspan> Founder of KODXO</text>
  <g transform="translate(60,186)"><rect width="90" height="30" rx="15" fill="#ffffffb3" stroke="#d0d7de"/><text x="45.0" y="20" text-anchor="middle" font-size="14" fill="#57606a">Odoo 19</text></g>
  <g transform="translate(160,186)"><rect width="81" height="30" rx="15" fill="#ffffffb3" stroke="#d0d7de"/><text x="40.5" y="20" text-anchor="middle" font-size="14" fill="#57606a">Python</text></g>
  <g transform="translate(251,186)"><rect width="90" height="30" rx="15" fill="#ffffffb3" stroke="#d0d7de"/><text x="45.0" y="20" text-anchor="middle" font-size="14" fill="#57606a">Next.js</text></g>
  <g transform="translate(351,186)"><rect width="159" height="30" rx="15" fill="#ffffffb3" stroke="#d0d7de"/><text x="79.5" y="20" text-anchor="middle" font-size="14" fill="#57606a">AI agents · RAG</text></g>
  <g transform="translate(520,186)"><rect width="81" height="30" rx="15" fill="#ffffffb3" stroke="#d0d7de"/><text x="40.5" y="20" text-anchor="middle" font-size="14" fill="#57606a">Docker</text></g>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#57606a" text-anchor="end">
      <text x="1140" y="100"><tspan fill="#2f6fed">$</tspan> ship --to production</text>
      <text x="1140" y="126">ERP · SaaS · AI</text>
      <text x="1140" y="152">TN · MA · GA · CA</text>
    </g>
  </g>
